<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#1d2433;--mu:#667085;--bd:#d9dfec;--ac:#2f6fed;--desk:#e8eefc;--tch:#ffe9b8;--bo:#1f5e4a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10141d;--card:#1a2030;--tx:#e8ecf5;--mu:#97a1b8;--bd:#2c3550;--ac:#6b9bff;--desk:#25304d;--tch:#5a4a22;--bo:#1d4a3b}}
:root[data-theme="dark"]{--bg:#10141d;--card:#1a2030;--tx:#e8ecf5;--mu:#97a1b8;--bd:#2c3550;--ac:#6b9bff;--desk:#25304d;--tch:#5a4a22;--bo:#1d4a3b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{touch-action:manipulation;overscroll-behavior-y:none}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:12px}
h1{font-size:20px;margin:0 0 10px}h2{font-size:15px;margin:0 0 10px}
.two{align-items:start;display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.wrap{max-width:1100px;margin:auto;display:grid;gap:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
label{font-size:13px;color:var(--mu)}
button,select,input,textarea{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:6px 10px}
button{cursor:pointer}button:hover{border-color:var(--ac)}
button.p{background:var(--ac);color:#fff;border-color:var(--ac)}
.cfg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:12px}.stp{display:inline-flex;align-items:center;border:1px solid var(--bd);border-radius:10px;overflow:hidden;background:var(--card)}.stp button{border:0;border-radius:0;padding:6px 16px;font-size:18px;line-height:1}.stp b{min-width:36px;text-align:center}
.cc{border:1px solid var(--bd);border-radius:10px;padding:8px;display:grid;gap:6px;min-width:130px}
.cc b{font-size:13px}.cc input{width:100%}
textarea{width:100%;min-height:80px;resize:vertical}
.room{overflow-x:auto}
.bd{background:var(--bo);color:#fff;text-align:center;border-radius:8px;padding:6px 40px;font-size:13px;letter-spacing:2px;width:max-content}.bd.v{writing-mode:vertical-rl;padding:40px 6px}
.bf{display:flex;margin-bottom:10px}.bf.l{justify-content:flex-start}.bf.m{justify-content:center}.bf.r{justify-content:flex-end}
.sw{display:flex;gap:14px;align-items:stretch;min-width:max-content}.sw .mid{flex:1}.sw .bc{display:flex;flex-direction:column}
.tr{display:flex;margin-bottom:10px}
.tr.l{justify-content:flex-start}.tr.m{justify-content:center}.tr.r{justify-content:flex-end}
.td{background:var(--tch);border:2px solid var(--bd);border-radius:8px;padding:8px 22px;font-weight:600;font-size:13px}
.cols{display:flex;gap:22px;justify-content:center;min-width:max-content;padding:4px}
.col{display:flex;flex-direction:column;gap:8px;align-items:center}
.ct{font-size:11px;color:var(--mu)}
.desk{display:flex;background:var(--desk);border:1px solid var(--bd);border-radius:8px;padding:4px;gap:3px}
.desk select{width:108px;font-size:12px;padding:5px 2px;text-align:center;text-align-last:center;border-radius:6px}.desk select.e{color:var(--mu)}
.back .cols{flex-direction:row}
.mp{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:10px 0}.mp label{display:grid;gap:3px}.mp select{width:100%}
.pv{overflow-x:auto;font-size:12px;margin-bottom:8px}.pv table{border-collapse:collapse}.pv td,.pv th{border:1px solid var(--bd);padding:3px 8px;white-space:nowrap}.pv th{background:var(--desk)}
[hidden]{display:none!important}
details.card>summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;user-select:none;-webkit-user-select:none}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary::before{content:'▸';color:var(--mu);transition:transform .15s;font-size:16px}
details.card[open]>summary::before{transform:rotate(90deg)}
details.card>summary h2{margin:0}details.card[open]>summary{margin-bottom:10px}
.md{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.mb{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;max-width:400px;width:100%}.mb h3{margin:0 0 10px;font-size:16px}.mb p{margin:0;font-size:14px}
.act{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}.dg{background:#d92d20;color:#fff;border-color:#d92d20}
.mb .one input{width:100%}.mb .one label{flex:1 1 45%}
@media (pointer:coarse){input,select,textarea{font-size:16px!important}.desk select{width:120px}}
.menu{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0;padding:8px;border:1px dashed var(--bd);border-radius:10px}
.sub{border:1px solid var(--bd);border-radius:10px;padding:10px;margin:8px 0}
.one{display:flex;flex-wrap:wrap;gap:8px;align-items:end}.one label{display:grid;gap:3px}.one input{width:110px}
.lst{max-height:280px;overflow:auto;border:1px solid var(--bd);border-radius:8px;margin:10px 0}
.lst table{width:100%;border-collapse:collapse;font-size:13px}.lst td,.lst th{padding:5px 8px;border-bottom:1px solid var(--bd);text-align:left}.lst th{position:sticky;top:0;background:var(--desk)}
.em{padding:16px;text-align:center;color:var(--mu);font-size:13px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;margin:-12px -12px 12px;padding:9px 12px;background:var(--card);border-bottom:1px solid var(--bd);font-size:12px;color:var(--mu);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.top a{color:inherit;text-decoration:none;cursor:inherit}
.top{padding-left:44px;padding-right:44px}

<details class="card noprint" data-k="ogrenci"><summary><h2>4) Öğrenciler <span id="fc" class="ct"></span></h2></summary>
 <div class="row">
  <button class="p" id="ae">＋ Öğrenci ekle ▾</button>
 </div>
 <div class="menu" id="am" hidden>
  <button id="m1">📄 Excel'den toplu ekle</button>
  <button id="m2">✏️ Tek tek ekle</button>
 </div>
 <div class="sub" id="pxl" hidden>
  <input type="file" id="xf" accept=".xlsx,.xls,.csv" hidden>
  <div id="mpw" hidden>
   <div class="row"><b>📄 Excel'den ekle · Sütun eşleştirme</b>
    <label><input type="checkbox" id="hd" checked> İlk satır başlık</label></div>
   <div class="mp" id="mp"></div>
   <div class="pv" id="pv"></div>
   <button class="p" id="ap">Eşleştirmeyi uygula ve ekle</button>
  </div>
 </div>
 <div class="sub" id="pone" hidden>
  <b>✏️ Tek tek ekle</b>
  <div class="one" style="margin-top:8px">
   <label>Numara<input id="o_no" inputmode="numeric"></label>
   <label>Sınıf<input id="o_sinif"></label>
   <label>Şube<input id="o_sube"></label>
   <label>Ad<input id="o_ad"></label>
   <label>Soyad<input id="o_soyad"></label>
   <button class="p" id="o_add">Ekle</button>
  </div>
 </div>
 <div class="lst" id="lst"></div>
 <div class="row">
  <button class="p" id="rnd">🎲 Rastgele dağıt</button>
  <button id="seq">Sırayla doldur</button>
  <button id="clr">Yerleşimi temizle</button>
  <button id="dall">Listeyi boşalt</button>
  <span id="st" class="ct"></span>
 </div>
</details>

<div class="card room" id="room"></div>
</div>

<div class="md" id="md" hidden><div class="mb" id="mb"></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const SEATN=['','Tekli','İkili','Üçlü','Dörtlü'];
let S={cols:[{d:5,s:2},{d:5,s:2},{d:5,s:2}],names:{},tp:'l',tf:'f',bw:'f',bp:'m',list:''};
try{const x=localStorage.getItem('sod');if(x){const o=JSON.parse(x);if(Array.isArray(o.cols)&&o.cols.length&&o.cols.every(c=>c&&c.d>0&&c.s>0))S=Object.assign(S,o)}}catch(e){}
const save=()=>{try{localStorage.setItem('sod',JSON.stringify(S))}catch(e){}};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v|0));

function cfg(){
 $('cn').textContent=S.cols.length;
 $('cfg').innerHTML=S.cols.map((c,i)=>`<div class="cc"><b>${i+1}. sıra</b>
 <label>Masa sayısı</label><input type="number" min="1" max="15" value="${c.d}" data-i="${i}" data-k="d">
 <label>Oturma</label><select data-i="${i}" data-k="s">${[1,2,3,4].map(n=>`<option value="${n}" ${c.s==n?'selected':''}>${SEATN[n]}</option>`).join('')}</select></div>`).join('');
 $('bw').value=S.bw;$('bp').value=S.bp;$('tp').value=S.tp;$('tf').value=S.tf;
}
function seat(k){
 const cur=S.names[k]||'',tot={},used={};
 STU.forEach(x=>{const n=nm(x);tot[n]=(tot[n]||0)+1});
 Object.values(S.names).forEach(n=>{if(n)used[n]=(used[n]||0)+1});
 const seen=new Set(),o=[];
 STU.forEach(x=>{const n=nm(x);if(seen.has(n))return;seen.add(n);if(n===cur||(tot[n]-(used[n]||0))>0)o.push(n)});
 if(cur&&!seen.has(cur))o.unshift(cur);
 return `<select data-k="${k}" class="${cur?'':'e'}"><option value="">— boş —</option>${o.map(n=>`<option value="${esc(n).replace(/"/g,'&quot;')}" ${n===cur?'selected':''}>${esc(n)}</option>`).join('')}<option value="__manual">✏️ Elle yaz…</option></select>`}
function room(){
 const t=`<div class="tr ${S.tp}"><div class="td">👩‍🏫 Öğretmen masası</div></div>`;
 const cols=S.cols.map((c,i)=>`<div class="col"><div class="ct">${i+1}. sıra · ${SEATN[c.s]}</div>`+
  Array.from({length:c.d},(_,d)=>`<div class="desk">`+Array.from({length:c.s},(_,s)=>{
   const k=`${i}-${d}-${s}`;return seat(k)}).join('')+`</div>`).join('')+`</div>`).join('');
 const body=`<div class="cols">${cols}</div>`;
 const mid=S.tf=='f'?t+body:body+t;
 if(S.bw=='f'){$('room').innerHTML=`<div class="bf ${S.bp}"><div class="bd">TAHTA</div></div>`+mid}
 else{const jc={l:'flex-start',m:'center',r:'flex-end'}[S.bp];
  const bc=`<div class="bc" style="justify-content:${jc}"><div class="bd v">TAHTA</div></div>`;
  $('room').innerHTML=`<div class="sw">${S.bw=='l'?bc:''}<div class="mid">${mid}</div>${S.bw=='r'?bc:''}</div>`}
 const total=S.cols.reduce((a,c)=>a+c.d*c.s,0),f=Object.values(S.names).filter(Boolean).length;
 $('st').textContent=`Toplam ${total} yer · ${f} dolu`;
}
function all(){cfg();room();save()}
const keys=()=>S.cols.flatMap((c,i)=>Array.from({length:c.d*c.s},(_,n)=>`${i}-${Math.floor(n/c.s)}-${n%c.s}`));
const list=()=>shown().map(nm);
function fill(arr){S.names={};const k=keys();arr.slice(0,k.length).forEach((n,i)=>S.names[k[i]]=n);
 room();save();if(arr.length>k.length)$('st').textContent+=` · ${arr.length-k.length} öğrenci sığmadı, masa ekleyin`}

$('cm').onclick=()=>{if(S.cols.length>1){S.cols.pop();all()}};
$('cp').onclick=()=>{if(S.cols.length<12){S.cols.push({d:5,s:2});all()}};
document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{const n=+b.dataset.p;
 S.cols=Array.from({length:n},()=>({d:5,s:n==2?3:2}));S.names={};all()});
$('cfg').addEventListener('change',e=>{const t=e.target,c=S.cols[t.dataset.i];if(!c)return;c[t.dataset.k]=clamp(t.value,1,t.dataset.k=="d"?15:4);all()});
$('room').addEventListener('change',e=>{const k=e.target.dataset.k;if(k===undefined)return;const v=e.target.value;
 if(v==='__manual'){dlg(`<h3>İsim yaz</h3><div class="one"><label style="flex:1 1 100%">Öğrenci adı<input id="mn" value="${esc(S.names[k]||'').replace(/"/g,'&quot;')}"></label></div><div class="act"><button id="dc">Vazgeç</button><button class="p" id="dy">Tamam</button></div>`);
  const ok=()=>{const t=$('mn').value.trim();if(t)S.names[k]=t;else delete S.names[k];closeDlg();room();save()};
  $('dc').onclick=()=>{closeDlg();room()};$('dy').onclick=ok;$('mb').onkeydown=ev=>{if(ev.key=='Enter')ok()};setTimeout(()=>$('mn').focus(),30);return}
 if(v)S.names[k]=v;else delete S.names[k];room();save()});
$('bw').onchange=e=>{S.bw=e.target.value;room();save()};
$('bp').onchange=e=>{S.bp=e.target.value;room();save()};
$('tp').onchange=e=>{S.tp=e.target.value;room();save()};
$('tf').onchange=e=>{S.tf=e.target.value;room();save()};
const hasPlan=()=>Object.values(S.names).some(Boolean);
const guard=(title,what,yes,fn)=>hasPlan()?confirmDlg(title,`Mevcut oturma düzeni <b>${what}</b>. Emin misin?`,yes,fn):fn();
$('rnd').onclick=()=>guard('Rastgele dağıt','silinip öğrenciler rastgele yeniden yerleştirilecek','Rastgele dağıt',()=>{const a=list();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}fill(a)});
$('seq').onclick=()=>guard('Sırayla doldur','silinip öğrenciler alfabetik sırayla yeniden yerleştirilecek','Sırayla doldur',()=>fill(list()));
$('clr').onclick=()=>{if(hasPlan())confirmDlg('Yerleşimi temizle','Tüm masalardaki öğrenciler <b>kaldırılacak</b>. Emin misin?','Temizle',()=>{S.names={};room();save()})};

/* ---- Öğrenci listesi ---- */
let ROWS=[],STU=[];
try{const x=JSON.parse(localStorage.getItem('sod_stu')||'[]');if(Array.isArray(x))STU=x}catch(e){}
const sortS=()=>STU.sort((a,b)=>((a.ad+' '+a.soyad).trim()).localeCompare((b.ad+' '+b.soyad).trim(),'tr',{sensitivity:'base'}));
const saveS=()=>{try{localStorage.setItem('sod_stu',JSON.stringify(STU))}catch(e){}};
const esc=t=>String(t??'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
const FLD=[['no','Numara'],['sinif','Sınıf'],['sube','Şube'],['ad','Ad'],['soyad','Soyad']];
const norm=t=>String(t).toLowerCase().replace(/ı/g,'i').replace(/ş/g,'s').replace(/ğ/g,'g').replace(/ü/g,'u').replace(/ö/g,'o').replace(/ç/g,'c').replace(/[^a-z0-9 ]/g,' ').trim();
function guess(h){const n=norm(h);
 if(/ad.*soyad|isim.*soyad/.test(n))return['ad','soyad'];
 if(/soyad/.test(n))return['soyad'];
 if(/sube/.test(n))return['sube'];
 if(/sinif|seviye/.test(n))return['sinif'];
 if(/(^| )(no|numara)( |$)|ogrenci no|okul no/.test(n))return['no'];
 if(/^(ad|adi|isim)$/.test(n))return['ad'];
 return[]}
const nm=x=>(x.ad+' '+x.soyad).trim();
const shown=()=>STU;
function renderList(){
 const L=shown();
 $('fc').textContent=`(${L.length}${L.length!=STU.length?' / '+STU.length:''} öğrenci)`;
 $('lst').innerHTML=!STU.length?'<div class="em">Henüz öğrenci yok. “Öğrenci ekle” ile başlayın.</div>':
 !L.length?'<div class="em">Bu filtreye uyan öğrenci yok.</div>':
 '<table><tr><th>No</th><th>Sınıf</th><th>Şube</th><th>Ad Soyad</th><th></th></tr>'+
 STU.map((x,i)=>L.includes(x)?`<tr><td>${esc(x.no)}</td><td>${esc(x.sinif)}</td><td>${esc(x.sube)}</td><td>${esc((x.ad+' '+x.soyad).trim())}</td><td style="white-space:nowrap"><button data-edit="${i}" title="Düzenle">✏️</button> <button data-del="${i}" title="Sil">✕</button></td></tr>`:'').join('')+'</table>';
 saveS()}
function after(){sortS();renderList();room()}
function buildMap(){
 if(!ROWS.length)return;
 const hd=$('hd').checked,cols=ROWS[0].length,hs=Array.from({length:cols},(_,i)=>hd&&String(ROWS[0][i]).trim()?String(ROWS[0][i]).trim():'Sütun '+(i+1));
 const g={};if(hd)hs.forEach((h,i)=>guess(h).forEach(f=>{if(g[f]===undefined)g[f]=i}));
 $('mp').innerHTML=FLD.map(([k,l])=>`<label>${l}<select data-f="${k}"><option value="">— yok —</option>${hs.map((h,i)=>`<option value="${i}" ${g[k]===i?'selected':''}>${esc(h)}</option>`).join('')}</select></label>`).join('');
 const data=(hd?ROWS.slice(1):ROWS).slice(0,4);
 $('pv').innerHTML='<table><tr>'+hs.map(h=>`<th>${esc(h)}</th>`).join('')+'</tr>'+data.map(r=>'<tr>'+hs.map((_,i)=>`<td>${esc(r[i])}</td>`).join('')+'</tr>').join('')+'</table>';
 $('pone').hidden=true;$('pxl').hidden=false;$('mpw').hidden=false}
const panel=w=>{$('pxl').hidden=w!='x';$('pone').hidden=w!='o';$('am').hidden=true;$('mpw').hidden=true;$('xf').value='';ROWS=[]};
$('ae').onclick=()=>{$('am').hidden=!$('am').hidden};
$('m1').onclick=()=>{panel('');$('xf').click()};
$('m2').onclick=()=>{panel('o');$('o_ad').focus()};
$('hd').onchange=buildMap;
$('xf').onchange=e=>{const f=e.target.files[0];if(!f)return;
 if(!window.XLSX){$('st').textContent='Excel kütüphanesi yüklenemedi (internet bağlantısı gerekir).';return}
 const r=new FileReader();
 r.onload=ev=>{try{const wb=XLSX.read(ev.target.result,{type:'array'});
  ROWS=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:'',raw:false}).filter(x=>x.some(c=>String(c).trim()));
  buildMap()}catch(err){$('st').textContent='Dosya okunamadı.'}};
 r.readAsArrayBuffer(f)};
$('ap').onclick=()=>{
 const m={};document.querySelectorAll('#mp select').forEach(x=>m[x.dataset.f]=x.value===''?null:+x.value);
 if(m.ad===null){$('st').textContent='En az "Ad" sütununu eşleştirin.';return}
 const comb=m.soyad===m.ad,v=(r,k)=>m[k]===null?'':String(r[m[k]]??'').trim();
 const add=($('hd').checked?ROWS.slice(1):ROWS).map(r=>({no:v(r,'no'),sinif:v(r,'sinif'),sube:v(r,'sube'),ad:v(r,'ad'),soyad:comb?'':v(r,'soyad')})).filter(x=>x.ad||x.soyad);
 STU=STU.concat(add);after();panel('');$('mpw').hidden=true;$('xf').value='';
 $('st').textContent=add.length+' öğrenci eklendi'};
$('o_add').onclick=()=>{
 const g=k=>$('o_'+k).value.trim(),x={no:g('no'),sinif:g('sinif'),sube:g('sube'),ad:g('ad'),soyad:g('soyad')};
 if(!x.ad&&!x.soyad){$('o_ad').focus();return}
 STU.push(x);after();['no','ad','soyad'].forEach(k=>$('o_'+k).value='');
 if(/^\d+$/.test(x.no))$('o_no').value=+x.no+1;
 $('o_ad').focus();$('st').textContent='Eklendi: '+(x.ad+' '+x.soyad).trim()};
$('pone').addEventListener('keydown',e=>{if(e.key=='Enter')$('o_add').click()});
const dlg=h=>{$('mb').innerHTML=h;$('md').hidden=false};
const closeDlg=()=>{$('md').hidden=true};
$('md').onclick=e=>{if(e.target===$('md'))closeDlg()};
document.addEventListener('keydown',e=>{if(e.key=='Escape')closeDlg()});
function confirmDlg(title,msg,yes,fn){
 dlg(`<h3>${title}</h3><p>${msg}</p><div class="act"><button id="dc">Vazgeç</button><button class="dg" id="dy">${yes}</button></div>`);
 $('dc').onclick=closeDlg;$('dy').onclick=()=>{closeDlg();fn()}}
function editDlg(i){
 const x=STU[i];
 dlg(`<h3>Öğrenciyi düzenle</h3><div class="one">
  <label>Numara<input id="e_no" value="${esc(x.no).replace(/"/g,'&quot;')}"></label>
  <label>Sınıf<input id="e_sinif" value="${esc(x.sinif).replace(/"/g,'&quot;')}"></label>
  <label>Şube<input id="e_sube" value="${esc(x.sube).replace(/"/g,'&quot;')}"></label>
  <label>Ad<input id="e_ad" value="${esc(x.ad).replace(/"/g,'&quot;')}"></label>
  <label>Soyad<input id="e_soyad" value="${esc(x.soyad).replace(/"/g,'&quot;')}"></label></div>
  <div class="act"><button id="dc">Vazgeç</button><button class="p" id="dy">Kaydet</button></div>`);
 const save=()=>{const g=k=>$('e_'+k).value.trim(),n={no:g('no'),sinif:g('sinif'),sube:g('sube'),ad:g('ad'),soyad:g('soyad')};
  if(!n.ad&&!n.soyad){$('e_ad').focus();return}
  const o=nm(x),nn=nm(n);
  if(o!==nn)Object.keys(S.names).forEach(k=>{if(S.names[k]===o)S.names[k]=nn});
  STU[i]=n;closeDlg();after();room();save_()};
 const save_=()=>{try{localStorage.setItem('sod',JSON.stringify(S))}catch(e){}};
 $('dc').onclick=closeDlg;$('dy').onclick=save;
 $('mb').onkeydown=e=>{if(e.key=='Enter')save()};
 $('e_ad').focus()}
$('lst').addEventListener('click',e=>{
 const t=e.target.closest('button');if(!t)return;
 if(t.dataset.edit!==undefined)editDlg(+t.dataset.edit);
 else if(t.dataset.del!==undefined){const i=+t.dataset.del,x=STU[i];
  confirmDlg('Öğrenciyi sil',`<b>${esc(nm(x))}</b> listeden silinecek. Emin misin?`,'Sil',()=>{STU.splice(i,1);after()})}});
$('dall').onclick=()=>{if(!STU.length)return;
 confirmDlg('Listeyi boşalt',`Listedeki <b>${STU.length}</b> öğrencinin tamamı silinecek. Emin misin?`,'Hepsini sil',()=>{STU=[];after()})};
all();after();
/* kart açık/kapalı durumu */
(()=>{let o={};try{o=JSON.parse(localStorage.getItem('sod_open')||'{}')||{}}catch(e){}
 document.querySelectorAll('details[data-k]').forEach(d=>{
  d.open=o[d.dataset.k]!==false;
  d.addEventListener('toggle',()=>{o[d.dataset.k]=d.open;try{localStorage.setItem('sod_open',JSON.stringify(o))}catch(e){}})})})();

/* tema */
(()=>{const R=document.documentElement,M=document.querySelector('meta[name="theme-color"]');
 const sys=()=>matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
 const show=t=>{$('tg').textContent=t=='dark'?'☀️':'🌙';if(M)M.content=t=='dark'?'#1a2030':'#ffffff'};
 let t=null;try{t=localStorage.getItem('sod_theme')}catch(e){}
 if(t!=='dark'&&t!=='light')t=null;
 if(t)R.dataset.theme=t;
 show(t||sys());
 $('tg').onclick=()=>{const c=R.dataset.theme||sys(),n=c=='dark'?'light':'dark';R.dataset.theme=n;show(n);try{localStorage.setItem('sod_theme',n)}catch(e){}}})();
/* PWA manifest */
(()=>{try{const I='data:image/png;base64,';
