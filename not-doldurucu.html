<style>
  :root{--bg:#f6f7f9;--card:#fff;--line:#e3e5ea;--text:#1f2430;--muted:#5b6272;--btn:#2b6cb0;--btn2:#245a94;--err:#c0392b;--soft:#e6f2f2;--in:#fff}
  @media (prefers-color-scheme: dark){:root{--bg:#10131b;--card:#1b2030;--line:#2c3347;--text:#eceef4;--muted:#a2a9bb;--btn:#3b82c4;--btn2:#4a90d2;--err:#ff8a7a;--soft:#1f3535;--in:#141826}}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;display:flex;align-items:center;justify-content:center;padding:16px;line-height:1.5}
  main{width:100%;max-width:440px;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:32px 22px 24px;box-shadow:0 10px 30px rgba(0,0,0,.08)}
  .ic{width:72px;height:72px;margin:0 auto 14px;border-radius:21px;background:var(--soft);display:flex;align-items:center;justify-content:center}
  .ic svg{width:38px;height:38px}
  h1{font-size:22px;margin:0 0 6px}
  p{margin:0 0 16px;color:var(--muted);font-size:15px}
  .row{position:relative;margin-bottom:10px}
  input{width:100%;font-size:16px;font-family:ui-monospace,Menlo,Consolas,monospace;padding:13px 70px 13px 14px;border:1px solid var(--line);border-radius:12px;background:var(--in);color:var(--text);outline:none;text-align:left}
  input:focus{border-color:var(--btn);box-shadow:0 0 0 3px rgba(43,108,176,.2)}
  .eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--btn);font-size:14px;font-weight:600;padding:8px 10px;cursor:pointer;width:auto}
  button.go{width:100%;font-size:17px;font-weight:600;padding:13px;border:0;border-radius:12px;background:var(--btn);color:#fff;cursor:pointer}
  button.go:hover{background:var(--btn2)}
  button.go:disabled{opacity:.6;cursor:default}
  #msg{min-height:22px;margin:10px 0 0;font-size:14px;color:var(--err)}
  #msg.n{color:var(--muted)}
  .ask{margin:16px 0 0;font-size:14px;color:var(--muted)}
  .ask a{color:var(--btn);font-weight:600;text-decoration:none}
  .ask a:hover{text-decoration:underline}
  footer{margin-top:16px;padding-top:14px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
</style>
</head>

function say(t,n){msg.textContent=t;msg.className=n?"n":"";}
function store(k,v){try{if(v===null){localStorage.removeItem(k);return true;}localStorage.setItem(k,v);return localStorage.getItem(k)===v;}catch(e){return false;}}
function load(k){try{return localStorage.getItem(k);}catch(e){return null;}}
async function open(code){
  code=String(code||"").replace(/\s+/g,"");
  if(!/^[0-9A-Za-z]{21}$/.test(code)){return null;}
  var enc=new TextEncoder();
  var id=hex(await S.digest("SHA-256",enc.encode("sebas-id:"+code))).slice(0,32);
  var slot=null,i;
  for(i=0;i<D.s.length;i++){if(D.s[i][0]===id){slot=D.s[i];break;}}
  if(!slot){return null;}
  var base=await S.importKey("raw",enc.encode(code),"PBKDF2",false,["deriveKey"]);
  var wk=await S.deriveKey({name:"PBKDF2",salt:b64(slot[1]),iterations:D.n,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  var K;
  try{K=await S.decrypt({name:"AES-GCM",iv:b64(slot[2])},wk,b64(slot[3]));}catch(e){return null;}
  var mk=await S.importKey("raw",K,"AES-GCM",false,["decrypt"]);
  var plain;
  try{plain=await S.decrypt({name:"AES-GCM",iv:b64(D.i)},mk,b64(D.p));}catch(e){return null;}
  return new TextDecoder().decode(plain);
}
function launch(html){document.open();document.write(html);document.close();}
function busy(b){go.disabled=b;inp.disabled=b;}
async function attempt(code,auto){
  busy(true);say(auto?"Açılıyor...":"Kontrol ediliyor...",true);
  var html=null;
  try{html=await open(code);}catch(e){html=null;}
  if(html){
    var saved=store(KEY,String(code).replace(/\s+/g,""));
    if(!saved&&!auto){say("Kod açıldı ama bu tarayıcı kodu hatırlayamıyor (gizli sekme olabilir).",true);}
    launch(html);return;
  }
  busy(false);
  if(auto){store(KEY,null);say("Kayıtlı kod artık geçerli değil. Lütfen yeni kodu girin.");}
  else{say("Kod hatalı. Lütfen kontrol edip tekrar deneyin.");inp.select();}
}
eye.addEventListener("click",function(){var show=inp.type==="password";inp.type=show?"text":"password";eye.textContent=show?"Gizle":"Göster";inp.focus();});
form.addEventListener("submit",function(e){e.preventDefault();if(!S){return;}if(!inp.value.trim()){say("Lütfen kodu girin.");return;}attempt(inp.value,false);});
if(!S){busy(true);say("Bu sayfa güvenli bağlantı (https) üzerinden açılmalıdır.");return;}
var saved=load(KEY);
if(saved){attempt(saved,true);}else{inp.focus();}
})();
