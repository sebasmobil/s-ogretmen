<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<title>Not Doldurucu - Askıya Alındı</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23d97757'/%3E%3Crect x='20' y='16' width='9' height='32' rx='3' fill='%23fff'/%3E%3Crect x='35' y='16' width='9' height='32' rx='3' fill='%23fff'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#f6f7f9; --card:#ffffff; --line:#e3e5ea; --text:#1f2430; --muted:#5b6272;
    --accent:#d97757; --accent-soft:#fbeee9;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#10131b; --card:#1b2030; --line:#2c3347; --text:#eceef4; --muted:#a2a9bb;
      --accent:#e08a6c; --accent-soft:#33241f;
    }
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    display:flex; align-items:center; justify-content:center;
    padding:16px; line-height:1.55;
  }
  main{
    width:100%; max-width:460px; text-align:center;
    background:var(--card); border:1px solid var(--line); border-radius:20px;
    padding:36px 24px 28px;
    box-shadow:0 10px 30px rgba(0,0,0,.08);
  }
  .ic{
    width:76px; height:76px; margin:0 auto 18px; border-radius:22px;
    background:var(--accent-soft); display:flex; align-items:center; justify-content:center;
  }
  .ic svg{width:40px; height:40px}
  h1{font-size:24px; margin:0 0 6px; letter-spacing:-.2px}
  .badge{
    display:inline-block; font-size:13px; font-weight:600; color:var(--accent);
    background:var(--accent-soft); border-radius:999px; padding:4px 12px; margin-bottom:18px;
  }
  p{margin:0 0 12px; font-size:17px}
  p.sub{color:var(--muted); font-size:15px}
  footer{margin-top:22px; padding-top:16px; border-top:1px solid var(--line); font-size:13px; color:var(--muted)}
</style>
</head>
<body>
<main role="main">
  <div class="ic" aria-hidden="true">
    <svg viewBox="0 0 64 64"><rect x="14" y="10" width="14" height="44" rx="4" fill="var(--accent)"/><rect x="36" y="10" width="14" height="44" rx="4" fill="var(--accent)"/></svg>
  </div>
  <h1>Not Doldurucu</h1>
  <div class="badge">Geçici olarak askıya alındı</div>
  <p>Not Doldurucu geçici olarak askıya alınmıştır.</p>
  <p>Tam uyum sağlandıktan sonra tekrar yayına alınacaktır.</p>
  <p class="sub">Anlayışınız için teşekkür ederiz.</p>
  <footer>&copy; sebasmobil 2026</footer>
</main>
</body>
</html>
